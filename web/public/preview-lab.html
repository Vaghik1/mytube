<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0f0f0f;color:#fff;font:14px sans-serif;margin:0;padding:8px}
.box{position:relative;width:360px;aspect-ratio:16/9;overflow:hidden;background:#222;margin:6px 0 2px;border-radius:10px}
.box div,.box iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
.tall iframe{top:-50%;height:200%}
.scaled iframe{transform:scale(1.12)}
p{margin:0 0 8px}
</style></head><body>
<p id="log"></p>
<div class="box plain"><div id="a"></div></div><p>A: plain</p>
<div class="box tall"><div id="b"></div></div><p>B: 200% tall (current)</p>
<div class="box scaled"><div id="c"></div></div><p>C: scaled 1.12</p>
<script>
const vid = new URLSearchParams(location.search).get('v') || 'dQw4w9WgXcQ';
const log = (t) => (document.getElementById('log').textContent += t + ' | ');
window.onYouTubeIframeAPIReady = () => {
  for (const id of ['a','b','c']) {
    new YT.Player(id, { videoId: vid, width: '100%', height: '100%',
      playerVars: { autoplay: 1, mute: 1, controls: 0, playsinline: 1, rel: 0, iv_load_policy: 3, cc_load_policy: 1, cc_lang_pref: 'en', origin: location.origin },
      events: {
        onReady: (e) => { e.target.mute(); e.target.playVideo(); log(id + ':ready'); },
        onStateChange: (e) => { log(id + ':s' + e.data); if (e.data === 1) { try { e.target.setOption('captions','track',{languageCode:'en'}); } catch (x) { log('opt-err'); } } },
        onApiChange: (e) => { const m = e.target.getOptions ? e.target.getOptions() : []; log(id + ':api ' + m.join(',')); },
        onError: (e) => log(id + ':err' + e.data),
      } });
  }
};
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script></body></html>
